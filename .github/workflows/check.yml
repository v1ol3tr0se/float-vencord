name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Biome
        run: npx --yes @biomejs/biome@2.6.3 ci
      - name: Vencord meta header
        run: |
          header=$(sed -n '1,/\*\//p' float.theme.css)
          for tag in name author version description; do
            grep -qE "^ \* @$tag \S" <<< "$header" || { echo "missing @$tag in the meta header"; exit 1; }
          done
